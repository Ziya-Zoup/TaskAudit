[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taskaudit-core"
version = "0.1.0"
description = "Robust refinement of fixed annotation-defined task classes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pengyuan Zou"}, {name = "Liming Liu"}]
dependencies = ["numpy>=2.0,<3", "scipy>=1.15,<2"]
keywords = ["robust optimization", "annotation uncertainty", "panel design"]

[project.scripts]
taskaudit-demo = "taskaudit_core.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["taskaudit_core*"]
namespaces = true

[tool.setuptools]
include-package-data = false

